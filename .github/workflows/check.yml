name: Check

# Required on every pull request in the organization through the "Merge policy" ruleset.
# Runs the repository's own `check` script. Repositories without one pass with a notice.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nested pnpm installs in a check script get the same protection as the install below.
    env:
      pnpm_config_ignore_scripts: "true"
      pnpm_config_ignore_pnpmfile: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the check script
        id: scripts
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ] && node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pnpm project with a check script. Nothing to run."
          fi

      - if: steps.scripts.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Corepack starts the pnpm version from `packageManager` faster than pnpm/action-setup.
      - if: steps.scripts.outputs.run == 'true'
        run: corepack enable

      # Caches downloaded packages only. The install below always runs, so every run
      # checks the lockfile against the repository's pnpm settings and the registry.
      - if: steps.scripts.outputs.run == 'true'
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - if: steps.scripts.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - if: steps.scripts.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - if: steps.scripts.outputs.run == 'true'
        run: pnpm check

  # Temporary, for the CloudCannon setup only: merges a CloudCannon publication
  # (preview into main) once all required checks pass. Remove when the sites
  # move to the new CMS.
  cloudcannon-auto-merge:
    name: CloudCannon auto-merge
    needs: check
    if: github.event.pull_request.user.login == 'cloudcannon[bot]' && github.head_ref == 'preview' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge "$PR" --repo "$REPO" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
