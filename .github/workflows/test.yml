name: Test

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: blacksmith-4vcpu-ubuntu-2404
      unit:
        type: boolean
        default: false
      http:
        type: boolean
        default: false
      browser:
        type: boolean
        default: false
      web-timeout-minutes:
        description: Maximum duration for setup and URL tests, after matching previews are ready.
        type: number
        default: 30
      preview-checks:
        description: JSON array of Netlify status contexts; the first is BASE_URL.
        type: string
        default: "[]"
      deployments:
        description: Optional JSON array of context, production url, Netlify config and base. Uses each build.ignore to select affected previews and verify unchanged builds.
        type: string
        default: "[]"
      node-version-file:
        type: string
        default: .node-version
      browser-artifacts:
        description: Newline-separated signed-out browser output paths, uploaded when browser tests fail.
        type: string
        default: ""
    secrets:
      testing-secret:
        required: false

permissions:
  contents: read
  statuses: read
  pull-requests: read

jobs:
  unit:
    name: Unit
    if: ${{ !github.event.pull_request.draft && inputs.unit }}
    runs-on: ${{ vars.CI_RUNNER || (github.event.repository.private == false && 'ubuntu-24.04') || inputs.runner }}
    timeout-minutes: 20
    env:
      pnpm_config_ignore_scripts: "true"
      pnpm_config_ignore_pnpmfile: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: "1.1.0"
          node-version-file: ${{ inputs.node-version-file }}
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
              - --ignore-scripts
      - name: Unit and service tests
        run: vp run test:unit

  preview:
    name: Preview
    if: ${{ !github.event.pull_request.draft && (inputs.http || inputs.browser) }}
    runs-on: ${{ vars.CI_RUNNER || (github.event.repository.private == false && 'ubuntu-24.04') || inputs.runner }}
    timeout-minutes: 15
    outputs:
      base-url: ${{ steps.preview.outputs.base-url }}
      deploy-urls: ${{ steps.preview.outputs.deploy-urls }}
      deploy-revisions: ${{ steps.preview.outputs.deploy-revisions }}
      web-enabled: ${{ steps.preview.outputs.web-enabled }}
    steps:
      - name: Read the PR build inputs
        if: ${{ inputs.deployments != '[]' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve previews for this PR revision
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_CHECKS: ${{ inputs.preview-checks }}
          DEPLOYMENTS: ${{ inputs.deployments }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull = context.payload.pull_request;
            if (!pull) throw new Error('URL tests require a pull_request event.');
            const sha = pull.head.sha;
            const targets = JSON.parse(process.env.DEPLOYMENTS || '[]');
            if (!Array.isArray(targets)) throw new Error('deployments must be an array.');
            let names = JSON.parse(process.env.PREVIEW_CHECKS);
            let selected = [];
            let changed;
            let compatible;
            if (targets.length) {
              const {execFileSync, spawnSync} = require('node:child_process');
              const {resolve, sep} = require('node:path');
              const root = process.env.GITHUB_WORKSPACE;
              const inside = path => {
                const absolute = resolve(root, path);
                if (absolute !== root && !absolute.startsWith(root + sep)) throw new Error('Build paths must stay in the checkout.');
                return absolute;
              };
              const git = args => execFileSync('git', args, {cwd: root, encoding: 'utf8', timeout: 10000, stdio: ['ignore', 'pipe', 'pipe']}).trim();
              const configs = new Map();
              for (const site of targets) {
                if (!/^netlify\/[a-z0-9-]+\/deploy-preview$/.test(site.context)
                  || !/^https:\/\/[a-z0-9.-]+$/.test(site.url) || configs.has(site.context)) {
                  throw new Error('deployments require unique Netlify contexts and HTTPS production origins.');
                }
                const ignore = execFileSync('python3', ['-c',
                  'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb")).get("build", {}).get("ignore", ""))',
                  inside(site.config)], {encoding: 'utf8', timeout: 10000}).trim();
                if (!ignore) throw new Error(`${site.context} needs a build.ignore rule.`);
                configs.set(site.context, {ignore, cwd: inside(site.base || '.')});
              }
              changed = (site, from, to) => {
                const config = configs.get(site.context);
                const result = spawnSync('bash', ['-e', '-o', 'pipefail', '-c', config.ignore], {
                  cwd: config.cwd, timeout: 10000,
                  env: {...process.env, CACHED_COMMIT_REF: from, COMMIT_REF: to},
                });
                if (![0, 1].includes(result.status)) throw new Error(`${site.context}: build.ignore failed.`);
                return result.status === 1;
              };
              let baseline;
              try { baseline = git(['merge-base', pull.base.sha, sha]); }
              catch { core.info('No PR baseline available; test every deployment.'); }
              // Test changes must exercise the new tests on every declared target.
              const testChanges = !baseline || git(['diff', '--name-only', baseline, sha, '--', 'tests', '.github/workflows/test.yml']);
              selected = targets.filter(site => testChanges || changed(site, baseline, sha));
              names = selected.map(site => site.context);
              compatible = (site, revision) => {
                if (!/^[0-9a-f]{40}$/.test(revision || '')) return false;
                if (revision === sha) return true;
                try { git(['merge-base', '--is-ancestor', revision, sha]); }
                catch { return false; }
                return !changed(site, revision, sha);
              };
              core.info(`Affected previews: ${names.join(', ') || 'none'}`);
              if (!names.length) {
                core.setOutput('web-enabled', 'false');
                core.setOutput('deploy-urls', '{}');
                return;
              }
            }
            if (!Array.isArray(names) || !names.length
              || names.some(name => typeof name !== 'string' || !/^netlify\/[a-z0-9-]+\/deploy-preview$/.test(name))) {
              throw new Error('Enabled URL tests require preview-checks.');
            }
            async function revisionAt(origin) {
              try {
                const response = await fetch(`${origin}/.well-known/build.json?revision=${sha}`, {
                  headers: {'Cache-Control': 'no-cache'}, redirect: 'error', signal: AbortSignal.timeout(10000),
                });
                return response.ok ? (await response.json()).revision : undefined;
              } catch { return undefined; }
            }
            const deadline = Date.now() + 12 * 60 * 1000;
            while (Date.now() < deadline) {
              const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: pull.number});
              if (current.state !== 'open' || current.draft || current.head.sha !== sha) {
                throw new Error('PR changed or returned to draft; discard this test run.');
              }
              const {data} = await github.rest.repos.getCombinedStatusForRef({owner, repo, ref: sha, per_page: 100});
              const urls = {};
              const revisions = {};
              await Promise.all(names.map(async name => {
                const status = data.statuses.find(status => status.context === name);
                if (['error', 'failure'].includes(status?.state)) {
                  throw new Error(`${name} failed for ${sha}.`);
                }
                if (status?.state !== 'success') return;
                const url = new URL(status.target_url);
                const site = name.split('/')[1];
                const origin = `https://deploy-preview-${pull.number}--${site}.netlify.app`;
                const built = url.origin === origin;
                const skipped = targets.length && url.hostname === 'app.netlify.com'
                  && /^\/(?:sites|projects)\/[^/]+\/deploys\/[^/]+\/?$/.test(url.pathname);
                if (url.protocol !== 'https:' || url.username || url.password || !(built || skipped)) {
                  throw new Error(`${name} did not return this PR's Netlify preview URL.`);
                }
                const revision = await revisionAt(origin);
                if (!targets.length) {
                  if (revision === sha) {
                    urls[name] = origin;
                    revisions[origin] = revision;
                  }
                  return;
                }
                const target = selected.find(site => site.context === name);
                if (built ? revision === sha : compatible(target, revision)) {
                  urls[name] = origin;
                  revisions[origin] = revision;
                } else if (skipped && target['production-fallback'] === true) {
                  // Static websites may have no first preview when their build was skipped.
                  // Signed-in apps must always use their isolated preview.
                  const production = await revisionAt(target.url);
                  if (compatible(target, production)) {
                    urls[name] = target.url;
                    revisions[target.url] = production;
                  }
                }
              }));
              if (names.every(name => urls[name])) {
                core.setOutput('base-url', urls[names[0]]);
                core.setOutput('deploy-urls', JSON.stringify(urls));
                core.setOutput('deploy-revisions', JSON.stringify(revisions));
                core.setOutput('sha', sha);
                core.setOutput('web-enabled', 'true');
                return;
              }
              core.info(`Waiting for matching previews: ${names.filter(name => !urls[name]).join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Matching previews did not complete within 12 minutes.');

  web:
    name: Web
    needs: preview
    if: ${{ !github.event.pull_request.draft && needs.preview.outputs.web-enabled == 'true' }}
    runs-on: ${{ vars.CI_RUNNER || (github.event.repository.private == false && 'ubuntu-24.04') || inputs.runner }}
    timeout-minutes: ${{ inputs.web-timeout-minutes }}
    # Signed-in tests can share preview accounts across browser targets and PRs.
    concurrency:
      group: qa-web-${{ github.repository }}
      cancel-in-progress: false
    env:
      pnpm_config_ignore_scripts: "true"
      pnpm_config_ignore_pnpmfile: "true"
      QA_PROFILE: preview
    steps:
      - name: Checkout the tested preview revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: "1.1.0"
          node-version-file: ${{ inputs.node-version-file }}
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
              - --ignore-scripts
      - name: Install desktop browsers
        if: ${{ inputs.browser }}
        run: vp exec playwright install --with-deps chromium firefox webkit
      - name: Confirm the PR still matches the tested revision
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_REVISIONS: ${{ needs.preview.outputs.deploy-revisions }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: pull.number});
            if (current.state !== 'open' || current.draft || current.head.sha !== pull.head.sha) {
              throw new Error('PR changed or returned to draft; discard this test run.');
            }
            const revisions = JSON.parse(process.env.DEPLOY_REVISIONS || '{}');
            await Promise.all(Object.entries(revisions).map(async ([origin, revision]) => {
              const response = await fetch(`${origin}/.well-known/build.json?revision=${pull.head.sha}`, {
                headers: {'Cache-Control': 'no-cache'}, redirect: 'error', signal: AbortSignal.timeout(10000),
              });
              if (!response.ok || (await response.json()).revision !== revision) {
                throw new Error(`${origin} changed while Web waited; rerun Test to verify its build inputs.`);
              }
            }));
      - name: HTTP tests
        if: ${{ inputs.http }}
        env:
          BASE_URL: ${{ needs.preview.outputs.base-url }}
          QA_DEPLOY_URLS: ${{ needs.preview.outputs.deploy-urls }}
        run: vp run test:http
      - name: Browser tests
        id: browser
        if: ${{ inputs.browser }}
        env:
          BASE_URL: ${{ needs.preview.outputs.base-url }}
          QA_DEPLOY_URLS: ${{ needs.preview.outputs.deploy-urls }}
          TESTING_SECRET: ${{ secrets.testing-secret }}
        # A virtual display on Linux, for repositories that run a browser headed.
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a vp run test:browser
          else
            vp run test:browser
          fi
      - name: Upload browser failure output
        if: ${{ failure() && steps.browser.outcome == 'failure' && inputs.browser-artifacts != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.browser-artifacts }}
          retention-days: 3
          if-no-files-found: warn

  test:
    name: Test
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [unit, preview, web]
    runs-on: ${{ vars.CI_RUNNER || (github.event.repository.private == false && 'ubuntu-24.04') || inputs.runner }}
    timeout-minutes: 2
    steps:
      - name: Require every enabled category
        env:
          UNIT_ENABLED: ${{ inputs.unit }}
          WEB_ENABLED: ${{ inputs.http || inputs.browser }}
          WEB_SELECTED: ${{ needs.preview.outputs.web-enabled }}
          UNIT_RESULT: ${{ needs.unit.result }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          if [[ "$UNIT_ENABLED" == true && "$UNIT_RESULT" != success ]]; then
            echo 'Enabled unit tests did not succeed.' >&2
            exit 1
          fi
          if [[ "$WEB_ENABLED" == true && "$PREVIEW_RESULT" != success ]]; then
            echo 'Required previews did not succeed.' >&2
            exit 1
          fi
          if [[ "$WEB_ENABLED" == true && "$WEB_SELECTED" != true && "$WEB_SELECTED" != false ]]; then
            echo 'Preview selection did not complete.' >&2
            exit 1
          fi
          if [[ "$WEB_ENABLED" == true && "$WEB_SELECTED" == true && "$WEB_RESULT" != success ]]; then
            echo 'Enabled URL tests did not succeed.' >&2
            exit 1
          fi
