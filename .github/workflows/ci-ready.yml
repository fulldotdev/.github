name: Ready

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_run:
    workflows: [Check, Review event]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: read

jobs:
  ready:
    uses: ./.github/workflows/ready.yml
