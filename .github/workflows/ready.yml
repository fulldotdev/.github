name: Ready

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: blacksmith-2vcpu-ubuntu-2404
      netlify-checks:
        type: string
        default: "[]"
      check-name:
        type: string
        default: Check / Check
      test-checks:
        type: string
        default: "[]"
      merge-app-client-id:
        type: string
        default: ""
    secrets:
      merge-app-private-key:
        required: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write
  checks: read

concurrency:
  group: ready-policy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ready:
    name: Ready
    runs-on: ${{ vars.CI_RUNNER || (github.event.repository.private == false && 'ubuntu-24.04') || inputs.runner }}
    timeout-minutes: 3
    steps:
      - name: Create merge token for repositories with release workflows
        if: ${{ inputs.merge-app-client-id != '' }}
        id: merge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.merge-app-client-id }}
          private-key: ${{ secrets.merge-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # Only the merge uses this token, so existing push-triggered releases still run.
      # Only GitHub metadata is read. Never check out or execute PR code here.
      - name: Reconcile publication requirements
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          NETLIFY_CHECKS: ${{ inputs.netlify-checks }}
          CHECK_NAME: ${{ inputs.check-name }}
          TEST_CHECKS: ${{ inputs.test-checks }}
          MERGE_TOKEN: ${{ steps.merge-token.outputs.token }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const repository = (await github.rest.repos.get({owner, repo})).data;
            const candidates = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open',
                  base: repository.default_branch, per_page: 100});
            async function mergeRequest(path, method, body) {
              const response = await fetch(`${process.env.GITHUB_API_URL}${path}`, {
                method, headers: {Authorization: `Bearer ${process.env.MERGE_TOKEN}`,
                  Accept: 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'}, body: JSON.stringify(body)});
              const result = await response.json();
              if (!response.ok || result.errors) {
                throw new Error(`Merge request failed (${response.status}): ${result.message ?? 'GraphQL error'}`);
              }
              return result;
            }
            async function processPull(number) {
              const getPull = async () => (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
              const pull = await getPull();
              if (pull.state !== 'open' || pull.base.ref !== repository.default_branch) return;
              const sha = pull.head.sha;
              const requiredTests = JSON.parse(process.env.TEST_CHECKS || '[]');
              const reviewTarget = {owner, repo, sha, context: 'Review', target_url: pull.html_url};
              let review;
              async function setReview(state, description) {
                // Pending already blocks publication, regardless of its wording.
                if (review?.state === state && (state === 'pending' || review.description === description)) return;
                await github.rest.repos.createCommitStatus({...reviewTarget, state, description});
                review = {state, description};
              }
              try {
                const result = await github.rest.repos.getCombinedStatusForRef({owner, repo, ref: sha, per_page: 100});
                review = result.data.statuses.find(status => status.context === 'Review');
              } catch (error) {
                // A failed status read must not leave a previous success in force.
                await setReview('pending', 'Unable to verify the current Review status.');
                throw error;
              }
              if (pull.draft) {
                await setReview('pending', 'Draft: publication is not authorized.');
                return;
              }
              if (requiredTests.length) await setReview('pending', 'Checking the current Test run and attempt.');
              async function testsPassed() {
                if (!requiredTests.length) return true;
                // Read the current run and attempt on every event. Check runs can
                // still show a previous success while the workflow is rerunning.
                const event = context.payload.workflow_run;
                let completedRunPending = false;
                for (let retry = 0; retry < 4; retry++) {
                  const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                    {owner, repo, head_sha: sha, event: 'pull_request', per_page: 100});
                  const run = runs.filter(run => run.name === 'Test' && run.head_sha === sha
                    && run.path === '.github/workflows/test.yml')
                    .sort((a, b) => b.id - a.id)[0];
                  const eventIsNewer = event?.name === 'Test' && event.head_sha === sha
                    && (!run || event.id > run.id || (event.id === run.id
                      && event.run_attempt > run.run_attempt));
                  const eventIsCurrent = event?.name === 'Test' && event.head_sha === sha
                    && run && event.id === run.id && event.run_attempt === run.run_attempt;
                  const completedEvent = (eventIsNewer || eventIsCurrent)
                    && event.status === 'completed' && event.conclusion === 'success';
                  completedRunPending = completedEvent
                    || (run?.status === 'completed' && run.conclusion === 'success');
                  if (eventIsNewer) {
                    if (!completedEvent) return false;
                  } else if (run) {
                    if (run.status === 'completed' && run.conclusion === 'success') {
                      const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
                        {owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100});
                      if (requiredTests.every(name => jobs.some(job => job.name === name
                        && job.status === 'completed' && job.conclusion === 'success'))) return true;
                    } else if (!completedEvent) return false;
                  }
                  // Successful completion can precede its jobs' metadata. Retry
                  // briefly so a final completion event cannot strand the PR.
                  if (retry < 3) await new Promise(resolve => setTimeout(resolve, 2000));
                }
                if (completedRunPending) throw new Error('Successful Test metadata is still incomplete. Rerun Ready to reconcile it.');
                return false;
              }
              const approved = await testsPassed();
              const current = await getPull();
              if (current.state !== 'open' || current.base.ref !== pull.base.ref
                || current.head.sha !== sha || current.draft !== pull.draft) return;
              const reviewPassed = !pull.draft && approved && await testsPassed();
              await setReview(reviewPassed ? 'success' : 'pending', reviewPassed
                ? 'Ready requirements passed for this revision.'
                : 'Waiting for required tests of this revision.');
              if (!reviewPassed) return;
              // Agents own code merges so they can follow the production deployment.
              // Keep the customer's CloudCannon Publish button automatic.
              const isCloudCannonPublication = candidate => candidate.user?.type === 'Bot'
                && candidate.user.login === 'cloudcannon[bot]'
                && candidate.head.ref === 'preview'
                && candidate.head.repo?.full_name === repository.full_name
                && candidate.base.repo?.full_name === repository.full_name;
              if (!isCloudCannonPublication(pull)) return core.info('Ready for the agent to merge and verify production.');
              // Workflow events can create jobs out of order. Compare the originating run first.
              // A skipped draft Check must never authorize automatic publication.
              const checks = await github.paginate(github.rest.checks.listForRef, {owner, repo, ref: sha, per_page: 100});
              const candidates = checks.filter(run => run.name === process.env.CHECK_NAME && run.app?.id === 15368);
              const runId = check => Number(check.details_url?.match(/\/actions\/runs\/(\d+)(?:\/|$)/)?.[1]);
              if (candidates.some(run => !runId(run))) return core.info('Waiting for comparable Ready Check metadata.');
              const check = candidates.sort((a, b) => runId(b) - runId(a) || b.id - a.id)[0];
              if (check?.conclusion !== 'success') return core.info('Waiting for a successful Ready Check.');
              // Rollout must install central requirements before enabling auto-merge.
              const {data: rules} = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}',
                {owner, repo, branch: pull.base.ref});
              const required = rules.filter(rule => rule.type === 'required_status_checks')
                .flatMap(rule => rule.parameters.required_status_checks.map(status => status.context));
              const expected = [process.env.CHECK_NAME, 'Review', ...JSON.parse(process.env.NETLIFY_CHECKS)];
              if (!expected.every(name => required.includes(name))) {
                return core.info('The complete central Check, Review and Netlify requirements are not active yet.');
              }
              if (!repository.allow_auto_merge) return core.info('Repository auto-merge is not enabled yet.');
              const final = await getPull();
              if (final.state !== 'open' || final.draft || final.base.ref !== pull.base.ref || final.head.sha !== sha) return;
              if (!isCloudCannonPublication(final)) return;
              if (!await testsPassed()) {
                await setReview('pending', 'Waiting for required tests of this revision.');
                return;
              }
              const method = final.head.ref === 'preview' && final.head.repo?.full_name === final.base.repo?.full_name
                ? 'merge' : 'squash';
              // Unrequired failed jobs can make GitHub report unstable; required rules still enforce this merge.
              if (['clean', 'unstable'].includes(final.mergeable_state)) {
                if (process.env.MERGE_TOKEN) {
                  await mergeRequest(`/repos/${owner}/${repo}/pulls/${number}/merge`, 'PUT', {sha, merge_method: method});
                } else {
                  await github.rest.pulls.merge({owner, repo, pull_number: number, sha, merge_method: method});
                }
                return;
              }
              if (final.auto_merge) return core.info('Auto-merge is already enabled.');
              const mutation = `mutation($id: ID!, $sha: GitObjectID!, $mergeMethod: PullRequestMergeMethod!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, expectedHeadOid: $sha, mergeMethod: $mergeMethod}) {
                  pullRequest { number }
                }
              }`;
              const variables = {id: final.node_id, sha, mergeMethod: method.toUpperCase()};
              if (process.env.MERGE_TOKEN) await mergeRequest('/graphql', 'POST', {query: mutation, variables});
              else await github.graphql(mutation, variables);
            }
            let failed = false;
            for (const pull of candidates) {
              try {
                await processPull(pull.number);
              } catch (error) {
                failed = true;
                core.error(`PR #${pull.number}: ${error.message}`);
              }
            }
            if (failed) core.setFailed('Some PRs could not be reconciled; see their errors above.');
